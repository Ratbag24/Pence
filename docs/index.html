<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Pence</title>
  <meta name="description" content="Budgeting for hourly and shift workers. Log your shifts, check your payslip is right, and see exactly when you'll hit your savings goal." />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0f1117" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Pence" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <script src="vendor/chart.umd.min.js"></script>
  <script src="tax.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --surface3: #2a2f45;
      --border: #2e3250;
      --accent: #4f8ef7;
      --accent-dim: #3b6fd4;
      --accent-soft: rgba(79,142,247,0.14);
      --green: #34d399;
      --green-soft: rgba(52,211,153,0.14);
      --red: #f87171;
      --red-soft: rgba(248,113,113,0.14);
      --amber: #fbbf24;
      --amber-soft: rgba(251,191,36,0.14);
      --cyan: #22d3ee;
      --text: #e2e8f0;
      --muted: #8892a8;
      --radius: 14px;
      --tabbar-h: 62px;
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      color-scheme: dark;
    }

    html { height: 100%; -webkit-text-size-adjust: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100%;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior-y: none;
      -webkit-tap-highlight-color: transparent;
    }

    #app { max-width: 540px; margin: 0 auto; min-height: 100vh; }

    #screens {
      padding: calc(14px + var(--sat)) 16px calc(var(--tabbar-h) + var(--sab) + 24px);
    }
    .screen { display: none; animation: fade .18s ease; }
    .screen.active { display: block; }
    @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

    /* ---------- typography ---------- */
    h1 { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.5px; }
    h2 { font-size: 1.15rem; font-weight: 700; letter-spacing: -0.2px; }
    .sub { color: var(--muted); font-size: .9rem; margin-top: 4px; }
    .eyebrow {
      font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px;
      color: var(--accent); margin-bottom: 10px;
    }
    .muted { color: var(--muted); }
    .small { font-size: .8rem; }
    .green { color: var(--green); } .red { color: var(--red); } .amber { color: var(--amber); } .cyan { color: var(--cyan); }
    .num { font-variant-numeric: tabular-nums; }

    .screen-head { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 18px; }

    /* ---------- cards ---------- */
    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 18px; margin-bottom: 14px;
    }
    .card.accent { border-color: rgba(79,142,247,0.4); background: linear-gradient(160deg, rgba(79,142,247,0.12), var(--surface) 60%); }
    .card.green { border-color: rgba(52,211,153,0.4); background: linear-gradient(160deg, rgba(52,211,153,0.12), var(--surface) 60%); }
    .card-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .card-title h2 { font-size: 1rem; }
    .big { font-size: 2.1rem; font-weight: 800; letter-spacing: -1px; line-height: 1.1; }
    .med { font-size: 1.3rem; font-weight: 700; letter-spacing: -0.3px; }

    .stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 10px; }
    .stat { background: var(--surface2); border-radius: 10px; padding: 12px; }
    .stat .lbl { font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; margin-bottom: 4px; }
    .stat .val { font-size: 1.05rem; font-weight: 700; }

    .kv { display: flex; justify-content: space-between; align-items: baseline; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: .95rem; }
    .kv:last-child { border-bottom: 0; }
    .kv .k { color: var(--muted); }
    .kv .k.indent { padding-left: 14px; }
    .kv.total { border-top: 2px solid var(--border); border-bottom: 0; margin-top: 4px; padding-top: 12px; font-weight: 700; }
    .kv.total .k { color: var(--text); }

    /* ---------- forms ---------- */
    .field { margin-bottom: 14px; }
    .field:last-child { margin-bottom: 0; }
    label, .label { display: block; font-size: .82rem; color: var(--muted); margin-bottom: 6px; }
    .input, select.input, textarea.input {
      width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px;
      color: var(--text); font-size: 16px; padding: 12px 13px; outline: none; transition: border-color .15s;
      -moz-appearance: textfield; appearance: none; font-family: inherit;
    }
    .input::-webkit-inner-spin-button, .input::-webkit-outer-spin-button { -webkit-appearance: none; }
    .input:focus { border-color: var(--accent); }
    .input.lg { font-size: 1.5rem; font-weight: 700; padding: 14px; }
    select.input { cursor: pointer; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 34px; }
    .input-wrap { position: relative; }
    .input-wrap .prefix { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); font-weight: 600; pointer-events: none; }
    .input-wrap .input { padding-left: 28px; }
    .input-wrap .suffix { position: absolute; right: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: .85rem; pointer-events: none; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    .hint { font-size: .78rem; color: var(--muted); margin-top: 6px; line-height: 1.4; }
    .with-select { display: flex; gap: 8px; }
    .with-select .input-wrap { flex: 1; min-width: 0; }
    .with-select select.input { flex: 0 0 auto; width: auto; }

    .seg { display: flex; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 3px; gap: 3px; }
    .seg button {
      flex: 1; border: 0; background: transparent; color: var(--muted); font-size: .85rem; font-weight: 600;
      padding: 9px 6px; border-radius: 8px; cursor: pointer; font-family: inherit; transition: all .15s; white-space: nowrap;
    }
    .seg button.on { background: var(--accent); color: #fff; }
    .seg.mini { padding: 2px; gap: 2px; }
    .seg.mini button { padding: 4px 9px; font-size: .72rem; border-radius: 6px; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      border: 0; border-radius: 12px; padding: 14px 18px; font-size: 1rem; font-weight: 700;
      cursor: pointer; font-family: inherit; transition: transform .08s, background .15s; text-decoration: none;
      background: var(--accent); color: #fff; width: 100%;
    }
    .btn:active { transform: scale(.98); }
    .btn.secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
    .btn.ghost { background: transparent; color: var(--accent); }
    .btn.danger { background: var(--red-soft); color: var(--red); }
    .btn.green { background: var(--green); color: #052e1f; }
    .btn.sm { padding: 9px 12px; font-size: .85rem; border-radius: 9px; width: auto; }
    .btn.icon { width: 38px; height: 38px; padding: 0; border-radius: 10px; }
    .btn[disabled] { opacity: .5; pointer-events: none; }
    .btn-row { display: flex; gap: 10px; }
    .btn-row .btn { flex: 1; }

    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      border: 1px solid var(--border); background: var(--surface2); color: var(--text); border-radius: 999px;
      padding: 7px 13px; font-size: .85rem; font-weight: 600; cursor: pointer; font-family: inherit;
    }
    .chip.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
    .chip.sm { padding: 5px 10px; font-size: .78rem; }
    .chip.dashed { border-style: dashed; color: var(--muted); background: transparent; }
    .chips.quick { gap: 6px; }

    .toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
    .toggle:last-child { border-bottom: 0; }
    .toggle .t-lbl { font-size: .95rem; }
    .toggle .t-sub { font-size: .78rem; color: var(--muted); margin-top: 2px; }
    .switch { position: relative; width: 46px; height: 27px; flex: 0 0 auto; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .switch span { position: absolute; inset: 0; background: var(--surface3); border-radius: 999px; transition: .2s; cursor: pointer; }
    .switch span::before { content: ""; position: absolute; width: 21px; height: 21px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }
    .switch input:checked + span { background: var(--green); }
    .switch input:checked + span::before { transform: translateX(19px); }

    details.section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 12px; }
    details.section summary {
      list-style: none; cursor: pointer; padding: 16px 18px; display: flex; justify-content: space-between; align-items: center;
      font-weight: 700; font-size: .95rem;
    }
    details.section summary::-webkit-details-marker { display: none; }
    details.section summary .chev { color: var(--muted); transition: transform .2s; font-size: .8rem; }
    details.section[open] summary .chev { transform: rotate(90deg); }
    details.section .body { padding: 0 18px 18px; }
    details.section summary .sum-val { color: var(--muted); font-weight: 500; font-size: .85rem; }

    /* ---------- ring ---------- */
    .ring-wrap { display: flex; align-items: center; gap: 18px; }
    .ring { width: 96px; height: 96px; flex: 0 0 auto; position: relative; }
    .ring svg { transform: rotate(-90deg); }
    .ring .track { stroke: var(--surface3); }
    .ring .bar { stroke: var(--green); stroke-linecap: round; transition: stroke-dashoffset .6s ease; }
    .ring .pct { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.05rem; }

    /* ---------- bars ---------- */
    .bars { display: flex; align-items: flex-end; gap: 6px; height: 74px; margin-top: 10px; }
    .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; }
    .bar-col .b { width: 100%; background: var(--accent-soft); border: 1px solid rgba(79,142,247,.35); border-radius: 5px 5px 2px 2px; min-height: 3px; }
    .bar-col.now .b { background: var(--accent); border-color: var(--accent); }
    .bar-col .l { font-size: .62rem; color: var(--muted); white-space: nowrap; }

    /* ---------- lists ---------- */
    .day-row { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); align-items: flex-start; }
    .day-row:last-child { border-bottom: 0; }
    .day-row .d { width: 44px; flex: 0 0 auto; text-align: center; padding-top: 2px; }
    .day-row .d .dn { font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
    .day-row .d .dd { font-size: 1.15rem; font-weight: 700; line-height: 1.2; }
    .day-row.today .d .dd { color: var(--accent); }
    .day-row .shifts { flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .shift-pill {
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
      background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; cursor: pointer;
      font-size: .9rem;
    }
    .shift-pill .t { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .shift-pill .tag { font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; padding: 2px 7px; border-radius: 999px; background: var(--surface3); color: var(--muted); flex: 0 0 auto; }
    .shift-pill .tag.premium { background: var(--amber-soft); color: var(--amber); }
    .shift-pill .tag.ot { background: var(--green-soft); color: var(--green); }
    .shift-pill .note { color: var(--muted); font-size: .8rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .add-shift { border: 1px dashed var(--border); border-radius: 10px; padding: 9px 12px; color: var(--muted); font-size: .85rem; cursor: pointer; background: transparent; text-align: left; font-family: inherit; width: 100%; }
    .add-shift:hover { border-color: var(--accent); color: var(--accent); }

    .nav-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 14px; }
    .nav-row .title { font-weight: 700; text-align: center; flex: 1; }
    .nav-row .title small { display: block; color: var(--muted); font-weight: 500; font-size: .78rem; margin-top: 2px; }

    .check-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: .9rem; }
    .check-item:last-child { border-bottom: 0; }
    .verdict { border-radius: 12px; padding: 14px 16px; margin-top: 14px; display: flex; gap: 12px; align-items: flex-start; }
    .verdict .ic { font-size: 1.4rem; line-height: 1; }
    .verdict.ok { background: var(--green-soft); border: 1px solid rgba(52,211,153,.4); }
    .verdict.under { background: var(--red-soft); border: 1px solid rgba(248,113,113,.4); }
    .verdict.over { background: var(--amber-soft); border: 1px solid rgba(251,191,36,.4); }
    .verdict b { display: block; margin-bottom: 3px; }

    .extra-row { display: grid; grid-template-columns: 1fr 96px 38px; gap: 8px; margin-bottom: 8px; align-items: center; }
    .extra-row select.input { grid-column: 1 / span 2; }
    .preset-row { grid-template-columns: 1fr 72px 72px 38px; }
    .preset-row select.input { grid-column: 1 / span 3; }

    .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
    .kpi { background: var(--surface2); border-radius: 10px; padding: 12px; }
    .kpi .lbl { font-size: .68rem; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); margin-bottom: 4px; }
    .kpi .val { font-size: 1.15rem; font-weight: 700; }

    .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -18px; padding: 0 18px; }
    table { width: 100%; border-collapse: collapse; font-size: .82rem; white-space: nowrap; }
    th { text-align: right; color: var(--muted); font-weight: 600; font-size: .7rem; text-transform: uppercase; letter-spacing: .6px; padding: 8px 8px; border-bottom: 1px solid var(--border); }
    th:first-child, td:first-child { text-align: left; }
    td { text-align: right; padding: 8px 8px; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; }
    tr.goal-row td { background: var(--green-soft); }
    .badge { display: inline-block; font-size: .65rem; font-weight: 800; padding: 2px 6px; border-radius: 999px; background: var(--green); color: #052e1f; margin-left: 6px; vertical-align: middle; }

    .empty { text-align: center; color: var(--muted); padding: 22px 10px; font-size: .9rem; line-height: 1.5; }
    .empty .em { font-size: 1.8rem; margin-bottom: 8px; }

    .note { background: var(--surface2); border-radius: 10px; padding: 10px 12px; font-size: .78rem; color: var(--muted); line-height: 1.45; }

    /* ---------- tab bar ---------- */
    #tabbar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
      background: rgba(26,29,39,.92); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border-top: 1px solid var(--border);
      padding-bottom: var(--sab);
    }
    #tabbar .inner { max-width: 540px; margin: 0 auto; display: flex; height: var(--tabbar-h); }
    #tabbar button {
      flex: 1; border: 0; background: transparent; color: var(--muted); font-family: inherit; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: .66rem; font-weight: 600;
      transition: color .15s;
    }
    #tabbar button svg { width: 23px; height: 23px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
    #tabbar button.on { color: var(--accent); }

    /* ---------- overlays ---------- */
    .hidden { display: none !important; }
    #sheet-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 40; animation: fadeIn .18s; }
    @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
    #sheet {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-width: 540px; margin: 0 auto;
      background: var(--surface); border-radius: 20px 20px 0 0; border: 1px solid var(--border); border-bottom: 0;
      padding: 12px 18px calc(22px + var(--sab)); max-height: 88vh; overflow-y: auto;
      animation: slideUp .22s cubic-bezier(.2,.8,.2,1);
    }
    @keyframes slideUp { from { transform: translateY(40px); opacity: 0 } to { transform: none; opacity: 1 } }
    #sheet .grab { width: 40px; height: 4px; background: var(--border); border-radius: 999px; margin: 0 auto 16px; }
    #sheet h2 { margin-bottom: 14px; }

    #onboarding {
      position: fixed; inset: 0; z-index: 50; background: var(--bg); overflow-y: auto;
      padding: calc(28px + var(--sat)) 22px calc(28px + var(--sab));
    }
    #onboarding .ob { max-width: 440px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }
    #onboarding .dots { display: flex; gap: 6px; margin-bottom: 30px; }
    #onboarding .dots i { height: 4px; flex: 1; background: var(--surface3); border-radius: 999px; }
    #onboarding .dots i.on { background: var(--accent); }
    #onboarding h1 { font-size: 1.7rem; margin-bottom: 8px; }
    #onboarding .lead { color: var(--muted); font-size: 1rem; margin-bottom: 26px; line-height: 1.5; }
    #onboarding .grow { flex: 1; }
    #onboarding .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 30px; font-weight: 800; letter-spacing: -0.3px; }
    #onboarding .logo img { width: 34px; height: 34px; border-radius: 9px; }

    #toast {
      position: fixed; left: 50%; bottom: calc(var(--tabbar-h) + var(--sab) + 14px); transform: translateX(-50%) translateY(20px);
      background: var(--text); color: var(--bg); padding: 11px 16px; border-radius: 999px; font-size: .88rem; font-weight: 600;
      opacity: 0; pointer-events: none; transition: all .22s; z-index: 60; white-space: nowrap; box-shadow: 0 8px 24px rgba(0,0,0,.35);
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .footer { text-align: center; color: var(--muted); font-size: .75rem; margin-top: 30px; line-height: 1.6; }
    .footer a { color: var(--muted); }
    @media (min-width: 700px) {
      body { background: #0a0c12; }
      #app { border-left: 1px solid var(--border); border-right: 1px solid var(--border); background: var(--bg); }
    }
  </style>
</head>
<body>

<div id="app">
  <main id="screens">
    <section class="screen" data-screen="home"></section>
    <section class="screen" data-screen="shifts"></section>
    <section class="screen" data-screen="payslip"></section>
    <section class="screen" data-screen="plan"></section>
    <section class="screen" data-screen="settings"></section>
  </main>

  <nav id="tabbar" aria-label="Main">
    <div class="inner">
      <button data-go="home" aria-label="Home">
        <svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>Home
      </button>
      <button data-go="shifts" aria-label="Shifts">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Shifts
      </button>
      <button data-go="payslip" aria-label="Payslip">
        <svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>Payslip
      </button>
      <button data-go="plan" aria-label="Plan">
        <svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg>Plan
      </button>
      <button data-go="settings" aria-label="Settings">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="9" cy="7" r="2" fill="var(--bg)"/><circle cx="15" cy="12" r="2" fill="var(--bg)"/><circle cx="8" cy="17" r="2" fill="var(--bg)"/></svg>Settings
      </button>
    </div>
  </nav>
</div>

<div id="onboarding" class="hidden"></div>
<div id="sheet-backdrop" class="hidden"></div>
<div id="sheet" class="hidden" role="dialog" aria-modal="true"></div>
<div id="toast" role="status"></div>

<script>
"use strict";

/* =====================================================================
   Pence v2 — budgeting for hourly & shift workers
   Single-file app. All data stays on-device in localStorage.
   ===================================================================== */

const APP_VERSION = "2.0.0";
const STORE_KEY   = "pence_v2";
const WEEKS_PER_YEAR = 52, MONTHS_PER_YEAR = 12;

/* TAX_YEAR, PAY_FREQ and calcDeductions live in tax.js (shared with the page generator). */

const EXP_CATEGORIES = [
  { id: "rent",      label: "Rent / mortgage", color: "#4f8ef7" },
  { id: "food",      label: "Food & groceries", color: "#34d399" },
  { id: "utils",     label: "Bills & utilities", color: "#fbbf24" },
  { id: "transport", label: "Transport",         color: "#f87171" },

const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const fmt  = n => (Math.round((n || 0) * 100) / 100).toLocaleString("en-GB", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmt0 = n => Math.round(n || 0).toLocaleString("en-GB");
const money  = n => (n < 0 ? "−£" : "£") + fmt(Math.abs(n));
const money0 = n => (n < 0 ? "−£" : "£") + fmt0(Math.abs(n));
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const hrs = n => fmt(n).replace(/\.00$/, "").replace(/(\.\d)0$/, "$1");

/* ---------- dates (all local time) ---------- */
const pad = n => String(n).padStart(2, "0");
const toKey   = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromKey = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const today   = () => { const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); };
const addDays   = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const addMonths = (d, n) => { const x = new Date(d); x.setMonth(x.getMonth() + n); return x; };
const weekStart = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); const start = (typeof S !== "undefined" && S.profile.weekStartDay === 0) ? 0 : 1; return addDays(x, -((x.getDay() - start + 7) % 7)); };
const monthStart = d => new Date(d.getFullYear(), d.getMonth(), 1);
const monthEnd   = d => new Date(d.getFullYear(), d.getMonth() + 1, 0);
/* the monthly pay period containing d — the calendar month unless a start day is set (e.g. 26th → 25th) */
const monthlyPeriod = d => {
  const sd = Math.min(28, Math.max(1, (typeof S !== "undefined" && S.profile.periodStartDay) || 1));
  let start = new Date(d.getFullYear(), d.getMonth(), sd);
  if (start > d) start = addMonths(start, -1);
  return { start, end: addDays(addMonths(start, 1), -1), calendar: sd === 1 };
};
/* how many pay weeks a period holds = how many week-start days fall inside it (4 or 5) */
const weeksInPeriod = (start, end) => { const wd = (typeof S !== "undefined" && S.profile.weekStartDay === 0) ? 0 : 1; let n = 0; for (let d = new Date(start); d <= end; d = addDays(d, 1)) if (d.getDay() === wd) n++; return n; };
const DAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
const DAYS_SUN = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const MON  = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const MONL = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
const fmtDay  = d => `${d.getDate()} ${MON[d.getMonth()]}`;
const fmtRange = (a, b) => a.getMonth() === b.getMonth() ? `${a.getDate()} – ${b.getDate()} ${MON[a.getMonth()]}` : `${fmtDay(a)} – ${fmtDay(b)}`;
const fmtMonthYear = d => `${MONL[d.getMonth()]} ${d.getFullYear()}`;
/* next payday from today, or null if not set. Monthly: day of month, pulled back to Friday if it
   lands on a weekend (when payEarlyIfWeekend). Weekly-based: next occurrence of the pay weekday. */
function nextPayday() {
  const p = S.profile, t = today();
  if (p.payFreq === "monthly") {
    if (!(p.payDay > 0)) return null;
    for (let i = 0; i < 3; i++) {
      const m = addMonths(monthStart(t), i);
      let d = new Date(m.getFullYear(), m.getMonth(), Math.min(p.payDay, monthEnd(m).getDate()));
      if (p.payEarlyIfWeekend !== false) { if (d.getDay() === 6) d = addDays(d, -1); else if (d.getDay() === 0) d = addDays(d, -2); }
      if (d >= t) return d;
    }
    return null;
  }
  if (!(p.payWeekday >= 0)) return null;
  return addDays(t, (p.payWeekday - t.getDay() + 7) % 7);
}
const fmtPeriod = per => per.calendar ? fmtMonthYear(per.start) : `${fmtRange(per.start, per.end)} ${per.end.getFullYear()}`;
const fmtLong = d => `${DAYS[(d.getDay() + 6) % 7]} ${d.getDate()} ${MON[d.getMonth()]}`;
const monthLabel = d => `${MON[d.getMonth()]} ${String(d.getFullYear()).slice(2)}`;

function shiftMult(type, p) {
  if (type === "premium") return 1 + (p.shiftPct || 0) / 100;
  if (type === "ot") return p.otMult || 1.5;
  return 1;
}
const shiftGross = (s, p) => (s.hours || 0) * (p.hourly || 0) * shiftMult(s.type, p);
const shiftRate  = p => (p.hourly || 0) * (1 + (p.shiftPct || 0) / 100);              // £/hr on shifts
const usualRate  = p => p.shiftPct > 0 && p.usualAtShiftRate !== false ? shiftRate(p) : (p.hourly || 0);
const usualType  = p => p.shiftPct > 0 && p.usualAtShiftRate !== false ? "premium" : "standard";
const presetPaid = pr => Math.max(0, (pr.hours || 0) - (pr.breakMins || 0) / 60);   // paid hours of a shift type
const resolveType = (t, p) => t === "usual" ? usualType(p) : (t === "premium" && !(p.shiftPct > 0) ? "standard" : t);
const shiftLabel = p => p.shiftMode === "rate" ? `Shift rate £${fmt(shiftRate(p))}` : `Premium +${fmt(p.shiftPct).replace(/\.00$/, "")}%`;
const planWeeklyGross = p => usualRate(p) * (p.baseHours || 0) + p.hourly * (p.otMult || 1) * (p.otHours || 0);
const monthlySavingsAmount = s => s.freq === "month" ? s.amount : s.amount * (WEEKS_PER_YEAR / MONTHS_PER_YEAR);
const avgExtraMonthly = list => list.reduce((sum, inc) => {
  const amt = inc.amount || 0;
  if (inc.freqMonths === 0) return sum + amt * (WEEKS_PER_YEAR / MONTHS_PER_YEAR);
  return inc.freqMonths > 0 ? sum + amt / inc.freqMonths : sum;
}, 0);

/* months until balance reaches goal at a monthly contribution & annual rate */
function monthsToGoal(balance, monthly, annualRate, goal) {
  if (goal <= 0) return null;
  if (balance >= goal) return 0;
  if (monthly <= 0 && annualRate <= 0) return null;
  const r = Math.pow(1 + annualRate / 100, 1 / 12) - 1;
  let b = balance;
  for (let m = 1; m <= 600; m++) {
    b = (b + monthly) * (1 + r);
    if (b >= goal) return m;
  }
  return null;
}

function deepMerge(base, over) {
  const out = Array.isArray(base) ? [] : {};
  for (const k of Object.keys(base)) {
    const b = base[k], o = over ? over[k] : undefined;
    if (b && typeof b === "object" && !Array.isArray(b)) out[k] = deepMerge(b, o && typeof o === "object" ? o : {});
    else out[k] = o === undefined ? b : o;
  }
  if (over) for (const k of Object.keys(over)) if (!(k in out)) out[k] = over[k];
  return out;
}

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return deepMerge(DEFAULT_STATE, JSON.parse(raw));
  } catch {}
  const migrated = migrateV1();
  return migrated || deepMerge(DEFAULT_STATE, {});
}

/* bring across data saved by Pence v1 so nobody loses their setup */
function migrateV1() {
  try {
    const inp = JSON.parse(localStorage.getItem("pence_inputs") || "null");
    if (!inp) return null;
    const g = k => num(inp[k]);
    const st = deepMerge(DEFAULT_STATE, {
      onboarded: true,
      profile: { hourly: g("hourly") || DEFAULT_STATE.profile.hourly, shiftPct: g("shiftRate"), baseHours: g("baseHours") || 37.5, otHours: g("otHours"), otMult: g("otMult") || 1.5 },
      expenses: { rent: g("exp_rent"), food: g("exp_food"), utils: g("exp_utils"), transport: g("exp_transport"), subs: g("exp_subs"), other: g("exp_other"), loans: g("loans") },
      savings: { amount: g("isaWeekly"), freq: inp.savingsFreq === "month" ? "month" : "week", balance: g("startSavings"), interestRate: g("interestRate"), goal: g("goal"), months: Math.max(1, parseInt(inp.months) || 24) },
    });
    const extra = JSON.parse(localStorage.getItem("pence_extra_incomes") || "null");
    if (Array.isArray(extra)) st.extraIncomes = extra.filter(e => e && (e.amount || e.label)).map(e => ({ label: e.label || "", amount: num(e.amount), freqMonths: parseInt(e.freqMonths) || 1 }));
    return st;
  } catch { return null; }
}

/* set a nested value by "a.b.c" path */
function setPath(path, value) {
  const parts = path.split(".");
  let o = S;
  for (let i = 0; i < parts.length - 1; i++) o = o[parts[i]];
  o[parts[parts.length - 1]] = value;
}

const Cap = window.Capacitor;
const isNative = !!(Cap && typeof Cap.isNativePlatform === "function" && Cap.isNativePlatform());
const Plug = (Cap && Cap.Plugins) || {};
function haptic(kind = "light") {
  try {
    if (Plug.Haptics) {
      if (kind === "success") Plug.Haptics.notification({ type: "SUCCESS" });
      else Plug.Haptics.impact({ style: kind === "medium" ? "MEDIUM" : "LIGHT" });
    } else if (navigator.vibrate) navigator.vibrate(kind === "success" ? [10, 30, 10] : 8);
  } catch {}
}
function initNative() {
  if (!isNative) return;
  try { Plug.StatusBar && Plug.StatusBar.setStyle({ style: "DARK" }); } catch {}
  try { Plug.StatusBar && Plug.StatusBar.setBackgroundColor && Plug.StatusBar.setBackgroundColor({ color: "#0f1117" }); } catch {}
  try {
    Plug.App && Plug.App.addListener("backButton", () => {
      if (!$("#sheet").classList.contains("hidden")) closeSheet();
      else if (ui.screen !== "home") go("home");
      else Plug.App.exitApp();

}

function weekShifts(ws) { const a = toKey(ws), b = toKey(addDays(ws, 6)); return S.shifts.filter(s => s.date >= a && s.date <= b); }
function periodKey() {
  return S.savings.freq === "month" ? toKey(today()).slice(0, 7) : toKey(weekStart(today()));
}
function greeting() {
  const h = new Date().getHours();

function renderHome() {
  const p = S.profile, sv = S.savings;
  const isMonth = p.homePeriod === "month";
  const ws = weekStart(today());
  const cur = monthlyPeriod(today());
  const periodAt = offset => monthlyPeriod(addMonths(cur.start, offset));
  const inRange = (a, b) => { const ka = toKey(a), kb = toKey(b); return S.shifts.filter(s => s.date >= ka && s.date <= kb); };
  const periodShifts = (offset) => isMonth
    ? (per => inRange(per.start, per.end))(periodAt(offset))
    : weekShifts(addDays(ws, 7 * offset));
  const fraction = isMonth ? 1 / 12 : 1 / 52;
  // a pay month holds 4 or 5 pay weeks — hourly pay follows that, not 52/12
  const weeksAuto = weeksInPeriod(cur.start, cur.end);
  const weeksKey = toKey(cur.start);
  const weeks = S.periodWeeks[weeksKey] || weeksAuto;
  const plannedWeekGross = planWeeklyGross(p);
  const plannedGross = isMonth ? plannedWeekGross * weeks : plannedWeekGross;
  const plannedHours = isMonth ? (p.baseHours || 0) * weeks : (p.baseHours || 0);
  const periodName = isMonth ? "month" : "week";

  const shifts = periodShifts(0);
  const hours = shifts.reduce((a, s) => a + s.hours, 0);

  const useGross = shifts.length ? gross : plannedGross;

  const lastShifts = periodShifts(-1);

function renderShifts() {

  const ws = ui.shiftsWeek, we = addDays(ws, 6);

  const hours = shifts.reduce((a, s) => a + s.hours, 0);

  const d = calcDeductions(gross, 1 / 52, p);
  const tk = toKey(today());
  const isThisWeek = toKey(ws) === toKey(weekStart(today()));
  const lastWeekHas = weekShifts(addDays(ws, -7)).length > 0;

  const days = [];
  for (let i = 0; i < 7; i++) {
    const day = addDays(ws, i), k = toKey(day);
    const list = shifts.filter(s => s.date === k);
    days.push(`
      <div class="day-row ${k === tk ? "today" : ""}">

    <div class="nav-row">

      <div class="title">${fmtRange(ws, we)} ${we.getFullYear()}<small>${isThisWeek ? "This week" : `<a href="#" data-act="week-today" style="color:var(--accent)">Back to this week</a>`}</small></div>
      <button class="btn icon secondary" data-act="week-next" aria-label="Next week">›</button>

    <div class="card">${days.join("")}</div>

function saveShiftFromSheet(id, isNew) {

/* =====================================================================
   PAYSLIP CHECK
   ===================================================================== */
function defaultPeriodEnd() {
  const t = today();
  if (S.profile.payFreq === "monthly") return addDays(monthlyPeriod(t).start, -1); // end of the last completed pay month
  return addDays(weekStart(t), -1); // day before this week started
}
function periodBounds(end) {
  const f = S.profile.payFreq;
  if (f === "monthly") { const per = monthlyPeriod(end); return { start: per.start, end: per.end, fraction: 1 / 12, label: fmtPeriod(per) }; }
  const weeks = PAY_FREQ[f].weeks;
  const start = addDays(end, -(weeks * 7 - 1));
  return { start, end, fraction: weeks / 52, label: `${fmtRange(start, end)} ${end.getFullYear()}` };
}
function shiftPeriod(end, dir) {
  const f = S.profile.payFreq;
  if (f === "monthly") { const ns = addMonths(monthlyPeriod(end).start, dir); return addDays(addMonths(ns, 1), -1); }
  return addDays(end, dir * PAY_FREQ[f].weeks * 7);
}

function renderPayslip() {
  const p = S.profile;
  if (!ui.payslipEnd) ui.payslipEnd = defaultPeriodEnd();
  const per = periodBounds(ui.payslipEnd);
  const a = toKey(per.start), b = toKey(per.end);
  const shifts = S.shifts.filter(s => s.date >= a && s.date <= b);
  const loggedHours = shifts.reduce((x, s) => x + s.hours, 0);
  const manualHours = num(ui.payslipHours);
  const usingManual = !shifts.length && manualHours > 0;
  const gross = shifts.length ? shifts.reduce((x, s) => x + shiftGross(s, p), 0) : manualHours * usualRate(p);
  const d = calcDeductions(gross, per.fraction, p);
  const actual = num(ui.payslipActual);
  const diff = actual - d.net;

  let verdict = "";
  if (ui.payslipActual !== "" && gross > 0) {
    if (Math.abs(diff) <= 5) verdict = `<div class="verdict ok"><div class="ic">✅</div><div><b>Looks right</b>Within £5 of what we'd expect. Small differences are normal (rounding, cumulative tax).</div></div>`;
    else if (diff < 0) verdict = `<div class="verdict under"><div class="ic">⚠️</div><div><b>You may have been underpaid by ${money(-diff)}</b>Check your hours and rate on the payslip against what you logged, then ask payroll to explain the difference.</div></div>`;
    else verdict = `<div class="verdict over"><div class="ic">👀</div><div><b>${money(diff)} more than expected</b>Could be a bonus, back-pay, holiday pay or a tax refund. Worth a quick look so it isn't clawed back later.</div></div>`;
  }

  const history = S.checks.slice(-5).reverse();

  $('[data-screen="payslip"]').innerHTML = `
    <div class="screen-head"><div><h1>Payslip check</h1><div class="sub">Did you get paid right?</div></div></div>
    <div class="nav-row">
      <button class="btn icon secondary" data-act="period-prev" aria-label="Previous pay period">‹</button>
      <div class="title">${per.label}<small>${PAY_FREQ[p.payFreq].label} pay · <a href="#" data-act="goto-settings" style="color:var(--accent)">change</a></small></div>
      <button class="btn icon secondary" data-act="period-next" aria-label="Next pay period">›</button>
    </div>

    <div class="card">
      <div class="card-title"><h2>What you should get</h2><span class="small muted">${shifts.length ? `${plural(shifts.length, "shift")} · ${hrs(loggedHours)}h logged` : "no shifts logged"}</span></div>
      ${!shifts.length ? `
        <div class="field"><label>Hours worked this period</label>
          <div class="input-wrap"><input class="input" type="number" inputmode="decimal" step="0.25" min="0" id="ps-hours" value="${esc(ui.payslipHours)}" placeholder="e.g. 160" /><span class="suffix">hrs at £${fmt(p.hourly)}</span></div>
          <div class="hint">Or <a href="#" data-act="goto-shifts" style="color:var(--accent)">log your shifts</a> and this fills in automatically.</div>
        </div>` : ""}
      ${gross > 0 ? `
        <div class="kv"><span class="k">Gross pay</span><span class="num">${money(d.gross)}</span></div>
        <div class="kv"><span class="k indent">− Income Tax</span><span class="num red">${money(d.tax)}</span></div>
        <div class="kv"><span class="k indent">− National Insurance</span><span class="num red">${money(d.ni)}</span></div>
        ${d.pension > 0 ? `<div class="kv"><span class="k indent">− Pension (${p.pensionPct}%)</span><span class="num red">${money(d.pension)}</span></div>` : ""}
        ${d.loan > 0 ? `<div class="kv"><span class="k indent">− Student loan (${TAX_YEAR.studentLoan[p.studentLoan].label})</span><span class="num red">${money(d.loan)}</span></div>` : ""}
        <div class="kv total"><span class="k">Expected take-home</span><span class="num green">${money(d.net)}</span></div>
      ` : `<div class="empty"><div class="em">🧾</div>${usingManual ? "" : "Enter your hours above, or log shifts for this period."}</div>`}
    </div>

    ${gross > 0 ? `
    <div class="card">
      <div class="card-title"><h2>What your payslip says</h2></div>
      <div class="field"><label>Net pay / take-home on the payslip</label>${moneyInput("ps-actual", ui.payslipActual, 'placeholder="0.00"')}</div>
      ${verdict}
      ${ui.payslipActual !== "" ? `<button class="btn secondary" style="margin-top:14px" data-act="save-check">Save this check</button>` : ""}
    </div>` : ""}

    <div class="note">Assumes tax code 1257L, England/Wales/NI rates, and a non-cumulative basis for this period. If your pay changes a lot week to week, HMRC's cumulative method can shift a few pounds between periods — it evens out over the year.</div>

    ${history.length ? `
    <div class="card" style="margin-top:14px">
      <div class="card-title"><h2>Previous checks</h2></div>
      ${history.map(c => { const df = c.actualNet - c.expectedNet; const cls = Math.abs(df) <= 5 ? "green" : df < 0 ? "red" : "amber";
        return `<div class="check-item"><span>${c.label}<br><span class="muted small">expected ${money(c.expectedNet)} · got ${money(c.actualNet)}</span></span><span class="num ${cls}">${Math.abs(df) <= 5 ? "✓ OK" : (df < 0 ? "−" : "+") + "£" + fmt(Math.abs(df))}</span></div>`; }).join("")}
    </div>` : ""}
  `;
}

function renderPlanResults() {
  const p = S.profile, e = S.expenses, sv = S.savings;
  const expTotal = EXP_CATEGORIES.reduce((a, c) => a + (e[c.id] || 0), 0) + (e.loans || 0);
  const grossWeek = planWeeklyGross(p);
  const grossYear = grossWeek * 52, grossMonth = grossYear / 12;
  const d = calcDeductions(grossYear, 1, p);
  const netMonth = d.net / 12;
  const monthlySavings = monthlySavingsAmount(sv);
  const avgExtra = avgExtraMonthly(S.extraIncomes);
  const spendable = netMonth - expTotal - monthlySavings;
  const monthlyRate = Math.pow(1 + sv.interestRate / 100, 1 / 12) - 1;

  // projection loop
  const t = today();
  let bal = sv.balance, totalInterest = 0, goalHit = null;
  const rows = [], labels = [monthLabel(t)], series = [bal];
  for (let m = 1; m <= sv.months; m++) {
    let extra = 0;
    S.extraIncomes.forEach(inc => {
      const amt = inc.amount || 0;
      if (inc.freqMonths === 0) extra += amt * (52 / 12);
      else if (inc.freqMonths > 0 && m % inc.freqMonths === 0) extra += amt;
    });
    const savedThisMonth = monthlySavings + extra;
    const interest = (bal + savedThisMonth) * monthlyRate;
    bal += savedThisMonth + interest; totalInterest += interest;
    const dt = addMonths(t, m);
    labels.push(monthLabel(dt)); series.push(bal);
    if (goalHit === null && sv.goal > 0 && bal >= sv.goal) goalHit = { m, dt };
    rows.push({ m, dt, savedThisMonth, interest, bal });
  }

  const kpis = [
    ["Gross / year", money0(grossYear), ""], ["Take-home / month", money0(netMonth), ""],
    ["Tax + NI / year", money0(d.tax + d.ni), "red"], ["Spendable / month", money0(spendable), spendable < 0 ? "red" : "green"],
    ["Saved / month", money0(monthlySavings + avgExtra), "cyan"], ["Interest earned", money0(totalInterest), "green"],
  ];

  $("#plan-results").innerHTML = `
    <div class="card">
      <div class="eyebrow">Results</div>
      <div class="kpis">${kpis.map(([l, v, c]) => `<div class="kpi"><div class="lbl">${l}</div><div class="val num ${c}">${v}</div></div>`).join("")}</div>
      ${sv.goal > 0 ? (goalHit ? `<div class="note" style="background:var(--green-soft)">🎯 <b>${esc(sv.goalLabel || "Goal")}</b> of ${money0(sv.goal)} reached in <b>${MON[goalHit.dt.getMonth()]} ${goalHit.dt.getFullYear()}</b> — month ${goalHit.m}.</div>`
                                : `<div class="note">Goal of ${money0(sv.goal)} isn't reached within ${sv.months} months at this rate. You'd finish on ${money0(bal)}.</div>`) : ""}
      ${spendable < 0 ? `<div class="note" style="background:var(--red-soft);margin-top:10px">⚠️ Your expenses and savings add up to more than your take-home. Try trimming the savings amount or expenses.</div>` : ""}
    </div>

    <div class="card">
      <div class="eyebrow">Where your pay goes</div>
      <div class="kv"><span class="k">Gross pay</span><span class="num">${money(grossYear)} / yr <span class="muted small">(${money(grossMonth)} / mo)</span></span></div>
      <div class="kv"><span class="k indent">− Income Tax</span><span class="num red">${money(d.tax)} / yr</span></div>
      <div class="kv"><span class="k indent">− National Insurance</span><span class="num red">${money(d.ni)} / yr</span></div>
      ${d.pension > 0 ? `<div class="kv"><span class="k indent">− Pension</span><span class="num red">${money(d.pension)} / yr</span></div>` : ""}
      ${d.loan > 0 ? `<div class="kv"><span class="k indent">− Student loan</span><span class="num red">${money(d.loan)} / yr</span></div>` : ""}
      <div class="kv"><span class="k">Take-home</span><span class="num">${money(netMonth)} / mo</span></div>
      <div class="kv"><span class="k indent">− Expenses &amp; loans</span><span class="num red">${money(expTotal)} / mo</span></div>
      <div class="kv"><span class="k indent">− Savings (£${fmt0(sv.amount)}/${sv.freq === "month" ? "mo" : "wk"})</span><span class="num amber">${money(monthlySavings)} / mo</span></div>
      <div class="kv total"><span class="k">Spendable</span><span class="num ${spendable < 0 ? "red" : "green"}">${money(spendable)} / mo</span></div>
    </div>

    <div class="card">
      <div class="eyebrow">Savings over ${sv.months} months</div>
      <div style="height:220px"><canvas id="plan-chart"></canvas></div>
    </div>

    <div class="card">
      <div class="eyebrow">Month by month</div>
      <div class="table-wrap"><table>
        <thead><tr><th>Month</th><th>Saved</th><th>Interest</th><th>Balance</th></tr></thead>
        <tbody>${rows.map(r => `<tr${goalHit && r.m === goalHit.m ? ' class="goal-row"' : ""}><td>${r.m} · ${monthLabel(r.dt)}${goalHit && r.m === goalHit.m ? '<span class="badge">GOAL</span>' : ""}</td><td class="green">£${fmt(r.savedThisMonth)}</td><td class="green">£${fmt(r.interest)}</td><td>£${fmt(r.bal)}</td></tr>`).join("")}</tbody>
      </table></div>
    </div>
  `;

  if (ui.chart) { ui.chart.destroy(); ui.chart = null; }
  if (window.Chart) {
    const ctx = $("#plan-chart").getContext("2d");
    const grad = ctx.createLinearGradient(0, 0, 0, 220); grad.addColorStop(0, "rgba(79,142,247,.35)"); grad.addColorStop(1, "rgba(79,142,247,0)");
    ui.chart = new Chart(ctx, {
      type: "line",
      data: { labels, datasets: [
        { label: "Balance", data: series, borderColor: "#4f8ef7", backgroundColor: grad, fill: true, tension: .3, pointRadius: 0, borderWidth: 2 },
        ...(sv.goal > 0 ? [{ label: "Goal", data: labels.map(() => sv.goal), borderColor: "#34d399", borderDash: [5, 5], pointRadius: 0, borderWidth: 1.5, fill: false }] : []),
      ]},
      options: { responsive: true, maintainAspectRatio: false, interaction: { mode: "index", intersect: false },
        plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => ` ${c.dataset.label}: £${fmt(c.raw)}` } } },
        scales: { x: { ticks: { color: "#8892a8", maxTicksLimit: 6, font: { size: 10 } }, grid: { color: "rgba(46,50,80,.5)" } },
                  y: { ticks: { color: "#8892a8", font: { size: 10 }, callback: v => "£" + fmt0(v) }, grid: { color: "rgba(46,50,80,.5)" } } } },
    });
  }
}

function renderOnboarding() {
  const el = $("#onboarding");
  el.classList.remove("hidden");

  const steps = [
    `<h1>What's your hourly rate?</h1><p class="lead">Your basic rate first. If you get a different rate on shifts, add that too — we'll sort overtime later.</p>
     <div class="field"><label>Basic rate</label><div class="input-wrap"><span class="prefix">£</span><input class="input lg" type="number" inputmode="decimal" step="0.01" min="0" id="ob-hourly" value="${ob.hourly}" placeholder="${TAX_YEAR.nationalLivingWage}" autofocus /></div>

     <div class="field"><label>Rate on shifts (if different)</label><div class="input-wrap"><span class="prefix">£</span><input class="input lg" type="number" inputmode="decimal" step="0.01" min="0" id="ob-shift" value="${ob.shiftRate}" placeholder="Same as basic" /></div>
     <div class="hint">e.g. £26.11 on shift when your basic is £16.11. Leave blank if you're paid the same all the time.</div></div>`,
    `<h1>How much do you usually work?</h1><p class="lead">A typical week is fine — you can log real shifts as you go.</p>
     <div class="field"><label>Hours per week</label><div class="input-wrap"><input class="input lg" type="number" inputmode="decimal" step="0.5" min="0" id="ob-hours" value="${ob.hours}" placeholder="37.5" autofocus /><span class="suffix">hrs</span></div></div>
     <div class="field"><label>How often are you paid?</label>${segHTML("ob-freq", Object.entries(PAY_FREQ).map(([v, o]) => ({ v, t: o.label.replace("Every 4 weeks", "4-weekly") })), ob.payFreq)}</div>`,
    `<h1>What are you saving for?</h1><p class="lead">Give it a name — it's a lot easier to skip a takeaway for "Ibiza" than for "savings".</p>
     <div class="field"><label>Goal</label><input class="input" type="text" id="ob-label" value="${esc(ob.goalLabel)}" placeholder="e.g. Holiday, car, house deposit" maxlength="30" autofocus /></div>
     <div class="row2">
       <div class="field"><label>Target amount</label><div class="input-wrap"><span class="prefix">£</span><input class="input" type="number" inputmode="decimal" step="1" min="0" id="ob-goal" value="${ob.goal}" placeholder="2000" /></div></div>
       <div class="field"><label>I can put aside</label><div class="with-select"><div class="input-wrap"><span class="prefix">£</span><input class="input" type="number" inputmode="decimal" step="1" min="0" id="ob-amount" value="${ob.amount}" placeholder="50" /></div><select class="input" id="ob-sfreq"><option value="week" ${ob.freq === "week" ? "selected" : ""}>/wk</option><option value="month" ${ob.freq === "month" ? "selected" : ""}>/mo</option></select></div></div>
     </div>`,
  ];
  el.innerHTML = `<div class="ob">
    <div class="logo"><img src="icon.svg" alt="" /> Pence</div>
    ${dots}
    ${steps[ob.step]}
    <div class="grow"></div>
    <div class="btn-row" style="margin-top:24px">
      ${ob.step > 0 ? `<button class="btn secondary" data-ob="back">Back</button>` : `<button class="btn ghost" data-ob="skip">Skip for now</button>`}
      <button class="btn" data-ob="next">${ob.step === 2 ? "Let's go" : "Continue"}</button>
    </div>
  </div>`;
  $$('[data-seg="ob-freq"] button').forEach(b => b.addEventListener("click", () => { ob.payFreq = b.dataset.v; $$('[data-seg="ob-freq"] button').forEach(x => x.classList.remove("on")); b.classList.add("on"); haptic(); }));
  el.querySelectorAll("[data-ob]").forEach(b => b.addEventListener("click", () => onboardingAction(b.dataset.ob)));
  el.querySelectorAll("input").forEach(i => i.addEventListener("keydown", ev => { if (ev.key === "Enter") onboardingAction("next"); }));
}
function onboardingAction(a) {
  haptic();
  if (a === "skip") return finishOnboarding();
  if (a === "back") { ob.step--; return renderOnboarding(); }
  if (ob.step === 0) { ob.hourly = $("#ob-hourly").value; ob.shiftRate = $("#ob-shift").value; if (num(ob.hourly) <= 0) return toast("Enter your hourly rate"); if (num(ob.shiftRate) > 0 && num(ob.shiftRate) < num(ob.hourly)) return toast("Shift rate should be at least your basic rate"); }
  if (ob.step === 1) { ob.hours = $("#ob-hours").value; if (num(ob.hours) <= 0) return toast("Enter your usual hours"); }
  if (ob.step === 2) { ob.goalLabel = $("#ob-label").value; ob.goal = $("#ob-goal").value; ob.amount = $("#ob-amount").value; ob.freq = $("#ob-sfreq").value; return finishOnboarding(); }
  ob.step++; renderOnboarding();
}
function finishOnboarding() {
  if (num(ob.hourly) > 0) S.profile.hourly = num(ob.hourly);
  if (num(ob.shiftRate) > num(ob.hourly) && num(ob.hourly) > 0) {
    S.profile.shiftPct = (num(ob.shiftRate) / num(ob.hourly) - 1) * 100;
    S.profile.shiftMode = "rate"; S.profile.usualAtShiftRate = true;
  }
  if (num(ob.hours) > 0) S.profile.baseHours = num(ob.hours);
  S.profile.payFreq = ob.payFreq;
  if (ob.goalLabel.trim()) S.savings.goalLabel = ob.goalLabel.trim();
  if (num(ob.goal) > 0) S.savings.goal = num(ob.goal);
  if (ob.amount !== "") S.savings.amount = num(ob.amount);
  S.savings.freq = ob.freq;
  S.onboarded = true; save();
  $("#onboarding").classList.add("hidden");
  haptic("success"); go("home");
}

async function exportData() {
  const json = JSON.stringify(S, null, 2);
  const name = `pence-backup-${toKey(today())}.json`;
  try {
    const file = new File([json], name, { type: "application/json" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: "Pence backup" }); return; }
  } catch (e) { if (e && e.name === "AbortError") return; }
  if (!isNative) {
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([json], { type: "application/json" })); a.download = name;
    document.body.appendChild(a); a.click(); a.remove(); return;
  }
  openSheet(`<h2>Your backup</h2><p class="hint" style="margin-bottom:10px">Copy this and keep it somewhere safe (notes, email to yourself).</p>
    <textarea class="input" rows="8" readonly style="font-family:monospace;font-size:12px">${esc(json)}</textarea>
    <button class="btn" style="margin-top:12px" data-act="copy-backup">Copy to clipboard</button>`);
}
function importData(file) {
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const data = JSON.parse(rd.result);
      if (!data || typeof data !== "object") throw 0;
      S = deepMerge(DEFAULT_STATE, data); S.onboarded = true; save();
      toast("Backup restored"); haptic("success"); go("home");
    } catch { toast("That file doesn't look like a Pence backup"); }
  };
  rd.readAsText(file);
}

/* =====================================================================
   EVENT WIRING — one delegated handler for clicks, one for inputs
   ===================================================================== */
document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-act]");
  if (!el) return;
  ev.preventDefault();
  const act = el.dataset.act;
  switch (act) {
    case "log-shift":     haptic(); shiftSheet(null, toKey(today())); break;
    case "add-shift":     haptic(); shiftSheet(null, el.dataset.date); break;
    case "edit-shift":    haptic(); shiftSheet(S.shifts.find(s => s.id === el.dataset.id)); break;
    case "save-shift":    saveShiftFromSheet(el.dataset.id, el.dataset.new === "true"); break;
    case "delete-shift":  S.shifts = S.shifts.filter(s => s.id !== el.dataset.id); save(); closeSheet(); haptic("medium"); render(); toast("Shift deleted"); break;
    case "quick-shift": {
      const pr = S.presets.find(x => x.id === el.dataset.preset); if (!pr) break;
      S.shifts.push({ id: uid(), date: el.dataset.date, hours: presetPaid(pr), breakMins: pr.breakMins || 0, type: resolveType(pr.type, S.profile), note: pr.name });
      S.shifts.sort((a, b) => a.date.localeCompare(b.date)); save(); haptic("success"); renderShifts(); toast(`${pr.name} logged`); break;
    }
    case "edit-presets":  haptic(); presetsSheet(el.dataset.date); break;
    case "add-preset":    haptic(); S.presets.push({ id: uid(), name: "", hours: 8, type: "usual" }); save(); presetsSheet(el.dataset.date); $$("#preset-list input[type=text]").pop()?.focus(); break;
    case "remove-preset": haptic(); S.presets.splice(+el.dataset.i, 1); save(); presetsSheet(el.dataset.date); break;
    case "presets-done":
      S.presets = S.presets.filter(x => x.name.trim() && presetPaid(x) > 0); save(); closeSheet(); haptic("success");
      if (el.dataset.date) shiftSheet(null, el.dataset.date); else render();
      break;
    case "week-prev":     haptic(); ui.shiftsWeek = addDays(ui.shiftsWeek, -7); renderShifts(); break;
    case "week-next":     haptic(); ui.shiftsWeek = addDays(ui.shiftsWeek, 7); renderShifts(); break;
    case "week-today":    haptic(); ui.shiftsWeek = weekStart(today()); renderShifts(); break;
    case "copy-last-week": {
      const prev = weekShifts(addDays(ui.shiftsWeek, -7));
      prev.forEach(s => S.shifts.push({ ...s, id: uid(), date: toKey(addDays(fromKey(s.date), 7)) }));
      S.shifts.sort((a, b) => a.date.localeCompare(b.date)); save(); haptic("success"); renderShifts(); toast(`Copied ${plural(prev.length, "shift")}`); break;
    }
    case "goto-payslip":  haptic(); go("payslip"); break;
    case "goto-shifts":   haptic(); go("shifts"); break;
    case "goto-settings": haptic(); go("settings"); break;
    case "period-prev":   haptic(); ui.payslipEnd = shiftPeriod(ui.payslipEnd, -1); ui.payslipActual = ""; ui.payslipHours = ""; renderPayslip(); break;
    case "period-next":   haptic(); ui.payslipEnd = shiftPeriod(ui.payslipEnd, 1); ui.payslipActual = ""; ui.payslipHours = ""; renderPayslip(); break;
    case "save-check": {
      const per = periodBounds(ui.payslipEnd), p = S.profile;
      const a = toKey(per.start), b = toKey(per.end);
      const shifts = S.shifts.filter(s => s.date >= a && s.date <= b);
      const gross = shifts.length ? shifts.reduce((x, s) => x + shiftGross(s, p), 0) : num(ui.payslipHours) * usualRate(p);
      const d = calcDeductions(gross, per.fraction, p);
      S.checks = S.checks.filter(c => c.label !== per.label);
      S.checks.push({ id: uid(), label: per.label, start: a, end: b, gross, expectedNet: d.net, actualNet: num(ui.payslipActual) });
      save(); haptic("success"); toast("Check saved"); renderPayslip(); break;
    }
    case "toggle-saved": {
      const pk = periodKey(), amt = S.savings.amount || 0;
      if ((S.deposits[pk] || 0) >= amt) { delete S.deposits[pk]; S.savings.balance = Math.max(0, S.savings.balance - amt); haptic(); toast("Undone"); }
      else { S.deposits[pk] = amt; S.savings.balance += amt; haptic("success"); toast(`£${fmt0(amt)} added to ${S.savings.goalLabel || "savings"}`); }
      save(); renderHome(); break;
    }
    case "period-weeks": {
      const n = +el.dataset.n;
      if (n) S.periodWeeks[el.dataset.key] = n; else delete S.periodWeeks[el.dataset.key];
      save(); haptic(); renderHome(); break;
    }
    case "edit-balance":
      haptic();
      openSheet(`<h2>Update balance</h2><p class="hint" style="margin-bottom:12px">What's actually in your savings right now?</p>
        <div class="field">${moneyInput("bal-input", S.savings.balance, "autofocus")}</div>
        <button class="btn" style="margin-top:8px" data-act="save-balance">Save</button>`);
      break;
    case "save-balance":  S.savings.balance = num($("#bal-input").value); save(); closeSheet(); haptic("success"); renderHome(); break;
    case "add-extra":     haptic(); S.extraIncomes.push({ label: "", amount: 0, freqMonths: 1 }); save(); renderPlan(); $$("#extra-list input[type=text]").pop()?.focus(); break;
    case "remove-extra":  haptic(); S.extraIncomes.splice(+el.dataset.i, 1); save(); renderPlan(); break;
    case "export":        haptic(); exportData(); break;
    case "copy-backup":   navigator.clipboard?.writeText(JSON.stringify(S)).then(() => toast("Copied")); break;
    case "import":        haptic(); $("#import-file").click(); break;
    case "reset":
      if (confirm("Delete all your Pence data on this device? This can't be undone.")) {
        localStorage.removeItem(STORE_KEY); localStorage.removeItem("pence_inputs"); localStorage.removeItem("pence_extra_incomes");
        S = deepMerge(DEFAULT_STATE, {}); ob.step = 0; renderOnboarding(); toast("Reset");
      }
      break;
  }
});

document.addEventListener("change", ev => {
  if (ev.target.id === "import-file" && ev.target.files[0]) { importData(ev.target.files[0]); ev.target.value = ""; }
});

let planTimer;
document.addEventListener("input", ev => {
  const el = ev.target;
  if (el.id === "ps-hours") { ui.payslipHours = el.value; clearTimeout(planTimer); planTimer = setTimeout(() => { const v = el.value; renderPayslip(); const n = $("#ps-hours"); if (n) { n.focus(); n.value = v; } }, 350); return; }
  if (el.id === "ps-actual") { ui.payslipActual = el.value; clearTimeout(planTimer); planTimer = setTimeout(() => { const v = el.value; renderPayslip(); const n = $("#ps-actual"); if (n) { n.focus(); n.value = v; } }, 350); return; }

  if (el.dataset.pi !== undefined) {
    const pr = S.presets[+el.dataset.pi]; if (!pr) return;
    pr[el.dataset.pk] = el.dataset.pk === "hours" ? num(el.value) : el.dataset.pk === "breakMins" ? Math.max(0, Math.round(num(el.value))) : el.value;
    save(); return;
  }
  if (el.dataset.extra !== undefined) {
    const inc = S.extraIncomes[+el.dataset.extra]; if (!inc) return;
    const k = el.dataset.k;
    inc[k] = k === "label" ? el.value : k === "freqMonths" ? parseInt(el.value) : num(el.value);
    save(); renderPlanResults(); return;
  }
  if (el.id === "pl-shiftrate") {
    const r = num(el.value), h = S.profile.hourly || 0;
    S.profile.shiftPct = r > 0 && h > 0 ? Math.max(0, (r / h - 1) * 100) : 0;
    save(); clearTimeout(planTimer); planTimer = setTimeout(renderPlanResults, 250); return;
  }
  const path = el.dataset.bind;
  if (!path) return;
  const type = el.dataset.type || "number";
  let val = type === "bool" ? el.checked : type === "string" ? el.value : type === "int" ? Math.max(1, parseInt(el.value) || 1) : type === "int0" ? (parseInt(el.value) || 0) : num(el.value);
  if (path === "profile.payDay") val = Math.min(31, Math.max(0, val));
  if (path === "profile.periodStartDay") { val = Math.min(28, val); ui.payslipEnd = null; }
  const keepRate = path === "profile.hourly" && S.profile.shiftMode === "rate" && S.profile.shiftPct > 0 ? shiftRate(S.profile) : null;
  setPath(path, val); save();
  if (keepRate !== null && val > 0) { S.profile.shiftPct = Math.max(0, (keepRate / val - 1) * 100); save(); }
  if (el.dataset.rerender === "plan") { renderPlan(); return; }
  if (ui.screen === "plan") { clearTimeout(planTimer); planTimer = setTimeout(renderPlanResults, 250); }
});

document.addEventListener("click", ev => {
  const pf = ev.target.closest('[data-seg="payFreq"] button');
  if (pf) { S.profile.payFreq = pf.dataset.v; ui.payslipEnd = null; save(); haptic(); renderSettings(); return; }
  const wk = ev.target.closest('[data-seg="weekStart"] button');
  if (wk) { S.profile.weekStartDay = +wk.dataset.v; ui.shiftsWeek = weekStart(today()); ui.payslipEnd = null; save(); haptic(); renderSettings(); return; }
  const hp = ev.target.closest('[data-seg="homePeriod"] button');
  if (hp) { S.profile.homePeriod = hp.dataset.v; save(); haptic(); renderHome(); }
});

/* =====================================================================
   BOOT
   ===================================================================== */
initNative();
if (!S.onboarded) renderOnboarding(); else go("home");

if (!isNative && "serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
